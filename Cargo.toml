[package]
name = "herdr-runner"
version = "0.1.0"
edition = "2024"
description = "A herdr pane for browsing and running Unity Test Runner tests in the open Editor."
publish = false

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
